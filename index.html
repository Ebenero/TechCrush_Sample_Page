<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCrush</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #001f3f 0%, #004d40 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.2rem;
            font-weight: 300;
            max-width: 600px;
            line-height: 1.6;
        }
        .emoji {
            font-size: 2rem;
            margin: 1rem 0;
        }
        .cta {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background-color: #ff6b6b;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .cta:hover {
            background-color: #ff5252;
        }
    </style>
</head>
<body>
    <h1>TechCrush 💻</h1>
    <div class="emoji">🚀✨🔥</div>
    <p>Welcome to TechCrush, where innovation meets creativity! Dive into the latest tech trends, tutorials, and vibes that keep you ahead of the game. Stay tuned for epic content that'll crush your tech curiosity! 🌟</p>
    <a href="#" class="cta">Explore Now</a>
</body>
</html>
